<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>نافس رياضيات •الصف السادس</title>
  <style>
    /* نفس الأنماط السابقة */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #1e5f6b 0%, #124c5c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .game-container {
      width: 100%;
      max-width: 750px;
      background: #ffffff;
      border-radius: 40px 40px 25px 25px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.4), 0 8px 10px rgba(0,0,0,0.2);
      border: 1px solid #f3b33d;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbe39f;
      padding: 8px 20px;
      border-bottom: 2px solid #d49b2a;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-area img {
      width: 42px;
      height: auto;
      border-radius: 30px;
      border: 2px solid #b8861e;
      background: white;
    }

    .school-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1d4c65;
    }

    .teacher-name {
      background: #1e4e6f;
      color: #fbe39f;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: inset 0 -2px 0 #0e3142;
      white-space: nowrap;
    }

    .screen {
      background: #fefcf0;
      padding: 20px 20px 25px;
    }

    .title-box {
      background: #f5b62e;
      text-align: center;
      padding: 10px 5px;
      border-radius: 50px;
      font-size: 2rem;
      font-weight: 800;
      color: #1f3f50;
      margin: 0 0 15px;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #b87d19;
    }

    .input-group {
      background: #e3f0f5;
      padding: 18px;
      border-radius: 35px;
      margin: 15px 0;
    }
    .input-group label {
      font-size: 1.2rem;
      font-weight: 600;
      display: block;
      margin-right: 10px;
      margin-bottom: 5px;
      color: #0e4760;
    }
    .input-group input {
      width: 100%;
      padding: 12px 20px;
      font-size: 1.2rem;
      border: 2px solid #2f789c;
      border-radius: 50px;
      outline: none;
    }

    .test-selection {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .test-btn {
      border: none;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 16px 5px;
      border-radius: 60px;
      box-shadow: 0 7px 0 rgba(0,0,0,0.3);
      cursor: pointer;
      transition: 0.07s;
      text-align: center;
    }
    .test-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .test-btn:nth-child(1) { background: #2e86ab; }
    .test-btn:nth-child(2) { background: #e67e22; }
    .test-btn:nth-child(3) { background: #27ae60; }
    .test-btn:nth-child(4) { background: #8e44ad; }

    .quiz-screen {
      background: #fefcf0;
      padding: 15px 18px 20px;
      display: none;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      background: #fce5a3;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .timer {
      background: #c0392b;
      color: white;
      padding: 2px 22px;
      border-radius: 40px;
      font-family: monospace;
      font-size: 1.6rem;
    }

    .score-badge {
      background: #206f94;
      color: white;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 1.3rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      color: #124257;
      padding: 15px 0 20px;
      background: transparent;
      border: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 10px 0 15px;
    }

    .option-btn {
      background: #d4e7f2;
      border: 2px solid #1e4e6f;
      border-radius: 40px;
      padding: 15px 5px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      color: #0c3d53;
      cursor: pointer;
      box-shadow: 0 4px 0 #638ea6;
      transition: 0.07s;
    }
    .option-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #638ea6; }

    .option-btn.correct { background: #27ae60; border-color: #1e7e4a; color: white; box-shadow: 0 4px 0 #1a5e38; }
    .option-btn.wrong { background: #e74c3c; border-color: #a93226; color: white; box-shadow: 0 4px 0 #852f26; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fef9e0;
      border-radius: 50px;
      padding: 25px 30px;
      max-width: 400px;
      text-align: center;
      border: 6px solid #f39c12;
      box-shadow: 0 15px 25px #00000055;
    }
    .modal-content p {
      font-size: 1.3rem;
      color: #1d3b4b;
      margin: 10px 0;
    }
    .modal-content button {
      background: #f4a261;
      border: none;
      font-size: 1.5rem;
      padding: 10px 35px;
      border-radius: 40px;
      font-weight: bold;
      color: white;
      box-shadow: 0 5px 0 #9c5e2c;
      cursor: pointer;
      margin-top: 15px;
    }
    .modal-content button:active { transform: translateY(4px); box-shadow: 0 1px 0 #9c5e2c; }

    .btn {
      background: #f4a261;
      border: none;
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 60px;
      width: 100%;
      box-shadow: 0 7px 0 #9c5e2c;
      cursor: pointer;
      margin: 10px 0;
    }
    .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #9c5e2c; }

    .certificate {
      background: #fbf3d7;
      border: 8px double #ca9e2b;
      padding: 20px;
      border-radius: 60px;
      text-align: center;
    }
    .review-table {
      width: 100%;
      border-collapse: collapse;
      background: #ebf3f7;
      border-radius: 30px;
      overflow: hidden;
      font-size: 0.85rem;
    }
    .review-table th { background: #1e4e6f; color: white; padding: 8px; }
    .review-table td { border-bottom: 1px solid #aaa; padding: 8px 4px; }
    .wrong-answer { background: #fad1d1; }
    .correct-answer { background: #c8e6c9; }

    .game-footer {
      text-align: center;
      padding: 8px 0 2px;
      color: #ffe8b5;
      font-size: 1rem;
      width: 100%;
      max-width: 750px;
    }
    .game-footer span { background: #0a2f40b3; padding: 5px 18px; border-radius: 40px; display: inline-block; }

    /* تنسيق الكسور */
    .fraction {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
    }
    .fraction > sup {
      display: block;
      font-size: 0.8em;
      line-height: 1;
    }
    .fraction > sub {
      display: block;
      font-size: 0.8em;
      line-height: 1;
    }
  </style>
</head>
<body>
<div class="game-container">
  <!-- شاشة البداية -->
  <div id="startScreen" class="screen">
    <div class="header">
      <div class="logo-area">
        <img src="https://www.wzufa.com/wp-content/uploads/2022/07/Riyadh-Al-Ebdaa-Schools.png" alt="شعار" onerror="this.src='https://via.placeholder.com/42?text=شعار'">
        <span class="school-name">مدارس رياض الإبداع الأهلية</span>
      </div>
      <div class="teacher-name">أيـمـن خـلـيـفـة</div>
    </div>
    <div class="title-box">🧮 نافس رياضيات - الصف السادس</div>
    <div class="input-group">
      <label>👤 اسم الطالب</label>
      <input type="text" id="studentNameInput" placeholder="أدخل اسمك">
    </div>
    <div style="text-align:center; margin:10px 0; font-size:1.3rem; font-weight:bold;">اختر التصنيف:</div>
    <div class="test-selection">
      <button class="test-btn" id="topicNumBtn">🔢 الأعداد والعمليات</button>
      <button class="test-btn" id="topicGeoBtn">📐 الهندسة والقياس</button>
      <button class="test-btn" id="topicStatBtn">📊 الإحصاء والاحتمالات</button>
      <button class="test-btn" id="topicPatBtn">🧩 الجبر والأنماط</button>
    </div>
    <!-- ملخص النتائج السابقة -->
    <div id="summaryArea" style="margin-top:20px; background:#e3f0f5; padding:15px; border-radius:35px; display:none;">
      <h3 style="color:#0e4760;">📋 نتائجك السابقة</h3>
      <div id="summaryList"></div>
    </div>
  </div>

  <!-- شاشة اللعب -->
  <div id="quizScreen" class="quiz-screen">
    <div class="header">
      <div class="logo-area">
        <img src="https://www.wzufa.com/wp-content/uploads/2022/07/Riyadh-Al-Ebdaa-Schools.png" alt="شعار">
        <span class="school-name">رياض الإبداع</span>
      </div>
      <div class="teacher-name">أيمن خليفة</div>
    </div>
    <div class="progress-row">
      <span id="questionCounter">س ١ / ٢٥</span>
      <span class="timer" id="timerDisplay">٠١:٠٠</span>
    </div>
    <div class="score-badge" id="scoreDisplay">🏆 ٠ نقطة</div>
    <div id="questionText" class="question-text">تحميل ...</div>
    <div class="options-grid" id="optionsContainer"></div>
    <button class="btn" id="nextBtn">⏩ التالي</button>
  </div>

  <!-- شاشة النهاية -->
  <div id="endScreen" class="screen" style="display:none;">
    <div class="header">
      <div class="logo-area">
        <img src="https://www.wzufa.com/wp-content/uploads/2022/07/Riyadh-Al-Ebdaa-Schools.png" alt="شعار">
        <span class="school-name">مدارس رياض الإبداع الأهلية</span>
      </div>
      <div class="teacher-name">أيمن خليفة</div>
    </div>
    <div id="certificateArea"></div>
    <!-- جدول ملخص النتائج الكلية -->
    <div style="margin-top:20px; background:#e3f0f5; padding:15px; border-radius:35px;" id="finalSummary">
      <h3 style="color:#0e4760;">📊 جميع نتائجك</h3>
      <div id="finalSummaryList"></div>
    </div>
    <button class="btn" id="showReviewBtn" style="background:#3684a3;">📋 مراجعة الإجابات</button>
    <button class="btn" id="restartBtn" style="background:#b56532;">🔁 العودة للرئيسية</button>
  </div>

  <!-- شاشة المراجعة -->
  <div id="reviewScreen" class="screen" style="display:none;">
    <h2 style="color:#1e4e6f;">📋 جميع الأسئلة</h2>
    <table class="review-table" id="reviewTable"></table>
    <button class="btn" id="backToEndBtn">🔙 العودة</button>
  </div>
</div>

<!-- النافذة المنبثقة للشرح (تظهر فقط عند الخطأ) -->
<div id="explainModal" class="modal-overlay">
  <div class="modal-content">
    <p id="modalExplainText"></p>
    <button id="closeModalBtn">حسناً</button>
  </div>
</div>

<!-- تذييل -->
<div class="game-footer">
  <span>مدارس رياض الإبداع الأهلية - نافس رياضيات -</span>
</div>

<script>
(function() {
  // دالة تحويل الأرقام إلى هندية مع تحويل الكسور إلى صيغة بسط/مقام
  function formatText(str) {
    if (typeof str !== 'string') return str;
    
    // أولاً: تحويل الأرقام الغربية إلى هندية
    const map = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    let converted = str.replace(/[0-9]/g, d => map[parseInt(d)]);
    
    // ثانياً: تحويل الأنماط مثل "٢/٥" إلى كسر عمودي
    // نبحث عن أي جزء من النص يطابق: رقم/رقم
    converted = converted.replace(/([٠-٩]+)\/([٠-٩]+)/g, '<span class="fraction"><sup>$1</sup><sub>$2</sub></span>');
    
    return converted;
  }

  // ---------- 100 سؤال فريد (25 لكل تصنيف) ----------
  const topics = {
    numbers: [ // الأعداد والعمليات (25)
      { q: "يدور كوكب الأرض حول الشمس في مدار دائري محيطه 150 مليون كلم. كم يبعد كوكب الأرض عن الشمس (نصف القطر) تقريباً؟", opts: ["23.9 مليون كم", "47.8 مليون كم", "75 مليون كم", "150 مليون كم"], correct: 0, exp: "المحيط = 2πr ، إذاً r = المحيط / (2π) ≈ 150 / 6.28 ≈ 23.9 مليون كم." },
      { q: "أي العبارات الرياضية التالية ناتجها يساوي 18؟", opts: ["4 + 5 × 2", "(4+5) × 2", "(4+2) × 5", "5 + 2 × 4"], correct: 1, exp: "(4+5)×2 = 9×2 = 18." },
      { q: "كم سنتمتراً مربعاً في المتر المربع الواحد؟", opts: ["100", "1000", "10000", "100000"], correct: 2, exp: "1 م = 100 سم، إذن 1 م² = 100×100 = 10000 سم²." },
      { q: "قام يوسف برمي العملة المعدنية أربع مرات وفي كل مرة حصل على الصورة. ما احتمال حصوله على الصورة في المرة السادسة؟", opts: ["0", "1/2", "1/4", "1"], correct: 1, exp: "رمية العملة حدث مستقل، احتمال الصورة دائماً 1/2." },
      { q: "أي الأرقام التالية غير مساوٍ لبقية الأرقام الأخرى؟", opts: ["4", "40", "2", "5"], correct: 1, exp: "الأرقام 4، 2، 5 أرقام أحادية، بينما 40 يتكون من رقمين." },
      { q: "مجلة رياضية من 16 صفحة، الإعلانات تشغل 33% منها. كم صفحة لا تحوي إعلانات؟", opts: ["9", "10", "11", "12"], correct: 2, exp: "33% من 16 ≈ 5.28 صفحة إعلانات، الباقي ≈ 10.72 أقرب 11." },
      { q: "دفع أمجد 43.5 ريالاً لشراء 6 تذاكر. ثمن التذكرة الواحدة؟", opts: ["7.25", "5.75", "4.35", "6.25"], correct: 0, exp: "43.5 ÷ 6 = 7.25 ريال." },
      { q: "يوجد على سلك 9 عصافير، انضم إليها 3، ثم طار 5. كم بقي؟", opts: ["12", "7", "6", "3"], correct: 1, exp: "9 + 3 - 5 = 7." },
      { q: "9 طلاب من السادس و9 من الخامس، لعب كل من السادس مع كل من الخامس مرة. كم مباراة؟", opts: ["81", "36", "18", "9"], correct: 0, exp: "9 × 9 = 81 مباراة." },
      { q: "العدد ثلاثمائة وستة عشر مليوناً وخمسة وثلاثون ألفاً وأربعمائة وخمسة عشر:", opts: ["316035415", "31635145", "316035145", "31605415"], correct: 0, exp: "316,035,415." },
      { q: "أرض مساحتها 4 كم²، كم مساحتها بالمتر المربع؟", opts: ["4000", "40000", "400000", "4000000"], correct: 3, exp: "1 كم² = 1,000,000 م²، إذاً 4 كم² = 4,000,000 م²." },
      { q: "يستطيع مصور تحميض فيلمين في 18 دقيقة. كم يحتاج لـ8 أفلام؟", opts: ["ساعة و12 دقيقة", "ساعة و20 دقيقة", "ساعة و44 دقيقة", "ساعة"], correct: 0, exp: "الفيلم الواحد 9 دقائق، 8 أفلام = 72 دقيقة = ساعة و12 دقيقة." },
      { q: "لدى خالد 60 ضيفاً، كل طاولة تسع 5 ضيوف. كم طاولة يحتاج؟", opts: ["8", "10", "11", "12"], correct: 3, exp: "60 ÷ 5 = 12 طاولة." },
      { q: "تكلفة تعبئة الخزان 97.62 ريال، أعطى 100 ريال. كم الباقي تقريباً؟", opts: ["2", "3", "4", "1"], correct: 0, exp: "100 - 97.62 = 2.38 ≈ 2." },
      { q: "لعب خالد 8 مباريات، في نصفها سجل هدفاً وفي النصف الآخر هدفين. مجموع أهدافه؟", opts: ["9", "10", "11", "12"], correct: 3, exp: "4 مباريات ×1 + 4 مباريات ×2 = 4+8=12." },
      { q: "يرتدي 6 طلاب قمصاناً صفراء من 14، إذا زاد العدد إلى 21 بنفس النسبة، كم يرتدي الأصفر؟", opts: ["9", "10", "14", "51"], correct: 0, exp: "النسبة 6/14 = 3/7، 21 × 3/7 = 9." },
      { q: "أمضى بدر سدسي المدة، ما الكسر المكافئ للباقي؟", opts: ["1/3", "2/3", "1/2", "1/4"], correct: 0, exp: "سدسين = 2/3، الباقي = 1/3." },
      { q: "عدد من ستة أرقام مجموع أرقامه يقبل القسمة على 3. أي مما يلي يحقق ذلك؟", opts: ["100001", "111111", "300001", "101010"], correct: 1, exp: "111111 مجموع أرقامه 6 يقبل على 3." },
      { q: "سعر تلفاز 3250 ريال، عليه خصم 20%. كم سعره بعد الخصم؟", opts: ["2600", "3000", "3100", "3200"], correct: 0, exp: "الخصم = 0.2×3250=650، الباقي = 2600." },
      { q: "إذا كان ٢/٥ من عدد يساوي ١٦، فما هذا العدد؟", opts: ["٤٠", "٣٠", "٥٠", "٦٠"], correct: 0, exp: "الكل = ١٦ × ٥/٢ = ٤٠" }, // تم تعديل الصياغة هنا
      { q: "ضرب عدد كلي أصغر من 10 في 0.8 وجمع 14.4 فكان 20. ما العدد؟", opts: ["5", "6", "7", "8"], correct: 2, exp: "س×0.8 + 14.4 = 20 → س×0.8 = 5.6 → س = 7." },
      { q: "يريد صالح توزيع 276 ريال على 3 محتاجين بالتساوي. نصيب كل منهم؟", opts: ["92", "138", "59", "47"], correct: 0, exp: "276 ÷ 3 = 92." },
      { q: "اشترى محمد 3 أقلام بـ12 ريال للقلم، وخصم 10 ريال. كم دفع؟", opts: ["26", "36", "46", "56"], correct: 0, exp: "3×12=36، بعد الخصم = 26." },
      { q: "ضعف ما مع سعيد = 16.8، فما معه؟", opts: ["8.4", "16.8", "33.6", "4.2"], correct: 0, exp: "16.8 ÷ 2 = 8.4." },
      { q: "يحتاج عامل 52 لتر دهان، العلبة 7 لتر. كم علبة يحتاج؟", opts: ["6", "7", "8", "9"], correct: 2, exp: "52 ÷ 7 = 7.43، يحتاج 8 علب." },
    ],
    geometry: [ // الهندسة والقياس (25)
      { q: "كم عدد المكعبات الصغيرة (1×1×1) الملونة من 3 جوانب في مكعب 6×6×6 مطلي بالكامل؟", opts: ["8", "18", "32", "36"], correct: 0, exp: "المكعبات ذات الثلاثة جوانب هي الرؤوس، وعددها 8." },
      { q: "ما سرعة عقرب الثواني مقارنة بعقرب الساعات؟", opts: ["3600", "720", "600", "240"], correct: 1, exp: "عقرب الثواني يدور دورة كل دقيقة، عقرب الساعات دورة كل 12 ساعة = 720 دقيقة، أي أسرع 720 مرة." },

  // دالة خلط
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function stopTimer() { if(timerInterval) clearInterval(timerInterval); }

  function startTimer() {
    timeLeft = 60; canAnswer = true; answered = false;
    timerDisplay.textContent = '٠١:٠٠';
    timerInterval = setInterval(() => {
      timeLeft--;
      let sec = timeLeft < 10 ? '٠'+timeLeft : timeLeft;
      timerDisplay.textContent = `٠٠:${sec}`;
      if(timeLeft <= 0 && canAnswer && !answered) {
        stopTimer();
        canAnswer = false; answered = true;
        student.answers[currentIndex] = -1;
        showAnswerFeedback(-1);
      }
    }, 1000);
  }

  function showAnswerFeedback(selectedIdx) {
    let q = currentQuestions[currentIndex];
    let correctIdx = q.correct;
    let allOptions = document.querySelectorAll('.option-btn');
    allOptions.forEach(btn => btn.classList.remove('correct', 'wrong'));
    allOptions[correctIdx].classList.add('correct');
    if(selectedIdx !== correctIdx) {
      if(selectedIdx !== -1) allOptions[selectedIdx].classList.add('wrong');
      modalText.innerHTML = formatText(q.exp); // استخدام innerHTML بدلاً من innerText للسماح بوسوم الكسور
      modal.style.display = 'flex';
    }
  }

  function loadQuestion(index) {
    if (!currentQuestions || currentQuestions.length === 0) {
      console.error('لا توجد أسئلة!');
      return;
    }
    stopTimer();
    startTimer();
    answered = false;
    let q = currentQuestions[index];
    questionCounter.innerHTML = `س ${formatText(index+1)} / ${formatText(currentQuestions.length)}`;
    questionText.innerHTML = formatText(q.q);
    optionsContainer.innerHTML = '';
    q.opts.forEach((opt, idx) => {
      let btn = document.createElement('div');
      btn.classList.add('option-btn');
      btn.innerHTML = formatText(opt);
      btn.dataset.opt = idx;
      btn.addEventListener('click', function handler(e) {
        if(!canAnswer || answered) return;
        stopTimer();
        canAnswer = false; answered = true;
        let selected = idx;
        student.answers[index] = selected;
        if(selected === q.correct) student.score += 1;
        scoreDisplay.innerHTML = `🏆 ${formatText(student.score)} نقطة`;
        showAnswerFeedback(selected);
      });
      optionsContainer.appendChild(btn);
    });
  }

  function finishQuiz() {
    stopTimer();
    completedSections.push({
      name: currentTopicName,
      score: student.score,
      total: currentQuestions.length,
      percent: (student.score/currentQuestions.length)*100
    });
    displayEndScreen();
  }

  function displayEndScreen() {
    quizScreen.style.display = 'none';
    endScreen.style.display = 'block';
    reviewScreen.style.display = 'none';
    let name = student.name || 'الطالب';
    let total = student.score;
    let percent = (total/currentQuestions.length)*100;
    let sectionName = currentTopicName;

    let message = '';
    if(percent >= 85) {
      message = `<div class="certificate">
        <h2>🏅 شهادة تقدير</h2>
        <p style="font-size:1.6rem;">مدارس رياض الإبداع</p>
        <h1 style="font-size:2.5rem;">${name}</h1>
        <p>القسم: ${sectionName} | الدرجة: ${formatText(total)} / ${formatText(currentQuestions.length)} (${formatText(percent.toFixed(1))}%)</p>
        <div style="background:gold; padding:8px 30px; border-radius:50px; display:inline-block; font-size:1.8rem; margin:10px;">🎓 ممتاز</div>
        <p style="margin:15px;">أ: أيمن خليفة</p>
        <p>⭐ أداء متميز، واصل تألقك ⭐</p>
      </div>`;
    } else {
      message = `<div class="certificate">
        <h2>💪 رسالة تحفيزية</h2>
        <p style="font-size:1.6rem;">مدارس رياض الإبداع</p>
        <h1 style="font-size:2.5rem;">${name}</h1>
        <p>القسم: ${sectionName} | الدرجة: ${formatText(total)} / ${formatText(currentQuestions.length)} (${formatText(percent.toFixed(1))}%)</p>
        <div style="background:#f4a261; padding:8px 30px; border-radius:50px; display:inline-block; font-size:1.5rem; margin:10px;">🌟 تحتاج مزيداً من التدريب</div>
        <p style="margin:15px;">لا تيأس، حاول مرة أخرى وراجع الدروس. النجاح حليف المجتهدين.</p>
        <p>المعلم: أيمن خليفة</p>
      </div>`;
    }
    document.getElementById('certificateArea').innerHTML = message;

    let finalHtml = '';
    completedSections.forEach((s, i) => {
      finalHtml += `<p><strong>${s.name}:</strong> ${formatText(s.score)} / ${formatText(s.total)} (${formatText(s.percent.toFixed(1))}%)</p>`;
    });
    finalSummaryList.innerHTML = finalHtml;
  }

  function buildReviewTable() {
    let html = '<tr><th>السؤال</th><th>إجابة الطالب</th><th>الصحيحة</th><th>شرح</th></tr>';
    currentQuestions.forEach((q, idx) => {
      let ans = student.answers[idx];
      let userTxt = (ans===null||ans===-1)?'لم يجب':q.opts[ans];
      let correctTxt = q.opts[q.correct];
      let rowClass = (ans===q.correct)?'correct-answer':'wrong-answer';
      html += `<tr class="${rowClass}"><td><strong>س${formatText(idx+1)}:</strong> ${formatText(q.q)}</td><td>${formatText(userTxt)}</td><td>${formatText(correctTxt)}</td><td>${formatText(q.exp)}</td></tr>`;
    });
    document.getElementById('reviewTable').innerHTML = html;
  }

  function startTest(topicKey) {
    let sName = nameInput.value.trim();
    if(!sName) {
      alert('الرجاء إدخال اسم الطالب');
      return;
    }
    student.name = sName;
    student.score = 0;
    const topicNames = {
      numbers: 'الأعداد والعمليات',
      geometry: 'الهندسة والقياس',
      statistics: 'الإحصاء والاحتمالات',
      patterns: 'الجبر والأنماط'
    };
    currentTopicName = topicNames[topicKey];
    
    // التأكد من وجود الأسئلة
    if (!topics[topicKey] || topics[topicKey].length === 0) {
      alert('عذراً، لا توجد أسئلة لهذا التصنيف حالياً.');
      return;
    }
    
    // نسخة من الأسئلة مع خلطها (لضمان عدم التكرار لأنها فريدة)
    currentQuestions = shuffleArray([...topics[topicKey]]);
    student.answers = new Array(currentQuestions.length).fill(null);
    currentIndex = 0;
    scoreDisplay.innerHTML = '🏆 ٠ نقطة';
    startScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    endScreen.style.display = 'none';
    reviewScreen.style.display = 'none';
    loadQuestion(0);
  }

  // ربط الأزرار
  document.getElementById('topicNumBtn').addEventListener('click', () => startTest('numbers'));
  document.getElementById('topicGeoBtn').addEventListener('click', () => startTest('geometry'));
  document.getElementById('topicStatBtn').addEventListener('click', () => startTest('statistics'));
  document.getElementById('topicPatBtn').addEventListener('click', () => startTest('patterns'));

  nextBtn.addEventListener('click', () => {
    if(!answered && canAnswer) {
      stopTimer();
      answered = true; canAnswer = false;
      student.answers[currentIndex] = -1;
      showAnswerFeedback(-1);
    } else {
      if(currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        finishQuiz();
      }
    }
  });

  closeModal.addEventListener('click', () => modal.style.display = 'none');

  document.getElementById('showReviewBtn').addEventListener('click', () => { buildReviewTable(); endScreen.style.display='none'; reviewScreen.style.display='block'; });
  document.getElementById('backToEndBtn').addEventListener('click', () => { reviewScreen.style.display='none'; endScreen.style.display='block'; });
  document.getElementById('restartBtn').addEventListener('click', () => {
    startScreen.style.display='block'; quizScreen.style.display='none'; endScreen.style.display='none'; reviewScreen.style.display='none'; stopTimer(); modal.style.display='none';
    // تحديث الملخص على الصفحة الرئيسية
    if (completedSections.length > 0) {
      summaryArea.style.display = 'block';
      let html = '';
      completedSections.forEach(s => {
        html += `<p><strong>${s.name}:</strong> ${formatText(s.score)} / ${formatText(s.total)} (${formatText(s.percent.toFixed(1))}%)</p>`;
      });
      summaryList.innerHTML = html;
    } else {
      summaryArea.style.display = 'none';
    }
  });

  window.onload = function() {
    if (completedSections.length > 0) {
      summaryArea.style.display = 'block';
      let html = '';
      completedSections.forEach(s => {
        html += `<p><strong>${s.name}:</strong> ${formatText(s.score)} / ${formatText(s.total)} (${formatText(s.percent.toFixed(1))}%)</p>`;
      });
      summaryList.innerHTML = html;
    }
  };
})();
</script>
</body>
</html>
